<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c91f2c">
  <meta name="description" content="Brasa 77: sabores que incendeiam. Conheça nosso cardápio.">
  <title>Brasa 77 | Sabores que incendeiam</title>
  <style>
    :root{
      --red:#c91f2c;--red-dark:#a91521;--orange:#f47735;--cream:#fff8f0;
      --paper:#fffdf9;--ink:#252321;--muted:#726b65;--line:#eee2d8;
      --shadow:0 12px 34px rgba(71,32,19,.09);--radius:20px
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:90px}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
    button,input{font:inherit}
    button,a{-webkit-tap-highlight-color:transparent}
    a{color:inherit;text-decoration:none}
    .topbar{background:var(--red);color:#fff;text-align:center;padding:8px 14px;font-size:.82rem;font-weight:700;letter-spacing:.04em}
    header{position:sticky;top:0;z-index:20;background:rgba(255,253,249,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .nav-wrap{max-width:1180px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:24px}
    .brand{font-size:1.75rem;font-weight:950;letter-spacing:-.07em;color:var(--red);white-space:nowrap}
    .brand span{color:var(--ink)}
    nav{display:flex;align-items:center;gap:18px;margin-left:auto}
    nav a{font-size:.9rem;font-weight:700;color:#514944;white-space:nowrap}
    nav a:hover,nav a.active{color:var(--red)}
    .nav-actions{display:flex;gap:8px;align-items:center}
    .icon-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;cursor:pointer;font-weight:800;color:var(--ink)}
    .cart-count{display:inline-grid;place-items:center;min-width:21px;height:21px;margin-left:5px;padding:0 5px;border-radius:99px;background:var(--red);color:white;font-size:.75rem}
    .menu-toggle{display:none}
    main{overflow:hidden}
    .hero{max-width:1180px;margin:0 auto;padding:58px 22px 54px;display:grid;grid-template-columns:.88fr 1.12fr;align-items:center;gap:28px;min-height:490px}
    .eyebrow{color:var(--red);font-size:.78rem;font-weight:900;letter-spacing:.17em;text-transform:uppercase}
    h1{font-size:clamp(2.8rem,5.3vw,5.4rem);line-height:.97;letter-spacing:-.065em;margin:15px 0 20px;font-weight:950}
    h1 .accent{color:var(--red)}
    .hero-copy{max-width:480px;color:var(--muted);font-size:1.05rem}
    .hero-buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
    .btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:999px;padding:14px 21px;background:var(--red);color:#fff;font-weight:800;cursor:pointer;transition:transform .18s,background .18s}
    .btn:hover{background:var(--red-dark);transform:translateY(-2px)}
    .btn.secondary{background:#fff;color:var(--red);border:1px solid #f0c8c5}
    .hero-art{position:relative;min-height:350px;display:grid;place-items:center}
    .hero-blob{position:absolute;inset:7% 3% 4% 8%;background:#ffe4d2;border-radius:47% 53% 42% 58% / 52% 42% 58% 48%;transform:rotate(-5deg)}
    .hero-image{position:relative;z-index:1;width:min(100%,560px);aspect-ratio:1.2/1;border-radius:32px;display:flex;align-items:end;justify-content:center;overflow:hidden;background:linear-gradient(135deg,#f9c08b,#e95b32 58%,#a71925);box-shadow:var(--shadow);padding:24px}
    .hero-image:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.22),transparent 55%)}
    .photo-placeholder{position:relative;z-index:1;text-align:center;color:white;text-shadow:0 2px 12px #6d211c88}
    .photo-placeholder .burger-emoji{font-size:clamp(5rem,12vw,9rem);display:block;filter:drop-shadow(0 12px 12px #61201555);line-height:1.1}
    .photo-placeholder strong{display:block;font-size:1.25rem;letter-spacing:.12em}
    .photo-placeholder small{display:block;font-size:.8rem;margin-top:4px}
    .hero-tag{position:absolute;z-index:2;left:0;bottom:8%;background:#fff;color:var(--ink);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);font-weight:900}
    .hero-tag span{display:block;color:var(--red);font-size:.72rem;letter-spacing:.08em}
    .section{padding:56px 22px}
    .section.soft{background:var(--cream)}
    .container{max-width:1180px;margin:auto}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}
    .section-head h2{font-size:clamp(1.8rem,3vw,2.7rem);line-height:1.05;letter-spacing:-.045em;margin:7px 0 0}
    .section-head p{color:var(--muted);max-width:430px;margin:0}
    .category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
    .category-card{min-height:145px;border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;justify-content:space-between;background:#fff;border:1px solid var(--line);transition:transform .18s,box-shadow .18s}
    .category-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
    .category-card .cat-icon{font-size:1.9rem}
    .category-card strong{font-size:1.18rem}
    .category-card small{color:var(--muted)}
    .menu-section{scroll-margin-top:80px}
    .product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .product{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:0 4px 18px rgba(71,32,19,.035)}
    .product-art{height:190px;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#fff0e4,#ffd5b8);overflow:hidden}
    .product-art .placeholder-icon{font-size:4.7rem;filter:drop-shadow(0 8px 7px #762c1b20)}
    .product-art .placeholder-label{position:absolute;bottom:10px;left:12px;background:#fffdf9e8;color:var(--red);padding:5px 9px;border-radius:999px;font-size:.7rem;font-weight:900}
    .product-body{padding:17px;display:flex;flex-direction:column;flex:1}
    .product h3{margin:0 0 7px;font-size:1.12rem;line-height:1.2}
    .product p{margin:0;color:var(--muted);font-size:.9rem;flex:1}
    .product-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:17px}
    .price{font-size:1.1rem;font-weight:950;color:var(--red);white-space:nowrap}
    .add-btn{border:0;background:var(--red);color:white;border-radius:999px;padding:10px 13px;font-weight:800;cursor:pointer}
    .add-btn:hover{background:var(--red-dark)}
    .note{font-size:.85rem;color:var(--muted);margin-top:18px}
    .challenge{background:var(--red);color:white;border-radius:26px;padding:32px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
    .challenge .eyebrow{color:#ffd7b5}
    .challenge h2{font-size:clamp(1.8rem,3.2vw,3rem);line-height:1.05;letter-spacing:-.04em;margin:9px 0}
    .challenge p{max-width:620px;color:#ffedeb;margin:0}
    .challenge .btn{background:#fff;color:var(--red);white-space:nowrap}
    .promo-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .promo-card{padding:26px;border-radius:22px;background:#fff0e5;border:1px solid #f5d4c0}
    .promo-card:nth-child(2){background:#fff;border-color:var(--line)}
    .promo-card h3{margin:0 0 8px;font-size:1.4rem}
    .promo-card p{color:var(--muted);margin:0 0 15px}
    .instagram{background:#292321;color:white;border-radius:22px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .instagram p{color:#e9dcd5;margin:5px 0 0}
    .instagram .btn{background:#fff;color:var(--red);white-space:nowrap}
    footer{background:#211d1b;color:#fff;padding:35px 22px}
    .footer-inner{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
    footer .brand span{color:#fff}
    footer p{color:#cfc4bd;font-size:.85rem;margin:6px 0}
    .overlay{position:fixed;inset:0;background:#1d1311a6;z-index:50;display:none}
    .overlay.open{display:block}
    .cart-panel{position:fixed;z-index:51;right:0;top:0;height:100dvh;width:min(440px,100%);background:var(--paper);padding:22px;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s;box-shadow:-10px 0 35px #0002}
    .cart-panel.open{transform:translateX(0)}
    .cart-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px}
    .cart-head h2{margin:0}
    .cart-items{overflow:auto;flex:1;padding:12px 0}
    .cart-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
    .cart-item strong{display:block}
    .cart-item small{color:var(--muted)}
    .qty{display:flex;align-items:center;gap:8px;margin-top:8px}
    .qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:white;cursor:pointer;font-weight:900}
    .cart-total{border-top:1px solid var(--line);padding-top:16px}
    .total-line{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:950;margin-bottom:8px}
    .cart-total p{font-size:.82rem;color:var(--muted)}
    .empty{text-align:center;color:var(--muted);padding:45px 10px}
    .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#272321;color:#fff;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:80;font-size:.9rem}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .hidden{display:none!important}
    @media(max-width:900px){
      .nav-wrap{gap:12px;padding:12px 16px}.brand{font-size:1.5rem}nav{gap:11px}nav a{font-size:.82rem}
      .hero{padding-top:38px;grid-template-columns:.9fr 1.1fr;gap:14px}.hero-art{min-height:300px}.hero-image{padding:15px}
      .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:680px){
      .topbar{font-size:.72rem}.nav-wrap{flex-wrap:wrap}.brand{margin-right:auto}nav{order:3;width:100%;margin:0;overflow-x:auto;padding:3px 0 5px;gap:17px}nav a{font-size:.84rem}
      .nav-actions{gap:5px}.icon-btn{padding:9px 11px}.hero{grid-template-columns:1fr;padding:36px 18px 30px;gap:5px}.hero-copy{font-size:.98rem}.hero-art{min-height:260px;margin-top:10px}.hero-image{width:100%;aspect-ratio:1.18/1;border-radius:24px}.hero-tag{left:3px;bottom:5%}
      .section{padding:40px 17px}.section-head{display:block}.section-head p{margin-top:10px}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.category-card{padding:16px;min-height:125px}.category-card .cat-icon{font-size:1.6rem}.category-card strong{font-size:1rem}
      .product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.product-art{height:135px}.product-art .placeholder-icon{font-size:3.3rem}.product-body{padding:12px}.product h3{font-size:1rem}.product p{font-size:.81rem}.product-bottom{align-items:flex-start;flex-direction:column;gap:9px;margin-top:13px}.add-btn{width:100%}.price{font-size:1.02rem}
      .challenge{grid-template-columns:1fr;padding:24px}.challenge .btn{justify-self:start}.promo-row{grid-template-columns:1fr}.instagram{align-items:flex-start;flex-direction:column;padding:23px}.instagram .btn{white-space:normal}
    }
  </style>
</head>
